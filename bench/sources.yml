# منابع fa-200: 60 خبر، 40 بلاگ، 40 محصول، 30 لندینگ/خدمات، 30 انجمن.
# gold.include/exclude = selectorهای مخصوص سایت برای برچسب «auto» (مستقل از استخراج‌گرهای filbert).
# min_chars: کمتر از این → برچسب نمی‌خورد (unlabeled) و باید دستی بررسی شود.
defaults:
  exclude_common: &exclude_common
    - script
    - style
    - noscript
    - form
    - button
    - "[class*=share]"
    - "[class*=related]"
    - "[class*=comment]"
    - "[class*=tags]"
    - "[class*=breadcrumb]"
    - "[class*=newsletter]"
    - "[class*=advert]"
    - "[class*=ads]"
    - "[class*=toc]"
    - "[class*=print:hidden]"

sources:
  # ---------- news (60) ----------
  - site: khabaronline
    type: news
    count: 10
    discover: {listing: ["https://www.khabaronline.ir/", "https://www.khabaronline.ir/service/Economy", "https://www.khabaronline.ir/service/Technology"], pattern: 'khabaronline\.ir/news/\d+', exclude: 'photo|video'}
    gold: {include: ["article.item h1", "article.item .item-summary", "article.item .item-text"], exclude: [".item-header", ".box.tags", ".item-nav", "*[class*=share]", "script", "style"], min_chars: 400}
  - site: mehrnews
    type: news
    count: 10
    discover: {listing: ["https://www.mehrnews.com/", "https://www.mehrnews.com/service/Economy", "https://www.mehrnews.com/service/Technology"], pattern: 'mehrnews\.com/news/\d+', exclude: 'photo|video'}
    gold: {include: ["article.item h1", "article.item .item-summary", "article.item .item-text"], exclude: [".item-header", ".box.tags", ".item-nav", "*[class*=share]", "script", "style"], min_chars: 400}
  - site: hamshahrionline
    type: news
    count: 8
    discover: {listing: ["https://www.hamshahrionline.ir/", "https://www.hamshahrionline.ir/service/Iran"], pattern: 'hamshahrionline\.ir/news/\d+', exclude: 'photo|video'}
    gold: {include: ["article.item h1", "article.item .introtext", "article.item .item-text"], exclude: [".item-boxes", ".box.tags", ".item-nav", ".item-header", "script", "style"], min_chars: 400}
  - site: donya-e-eqtesad
    type: news
    count: 8
    discover: {listing: ["https://www.donya-e-eqtesad.com/"], pattern: 'donya-e-eqtesad\.com/.+/\d{6,}'}
    gold: {include: ["main article header h1", "main article [class*=text-lead]", "main article .news_article_content"], exclude: ["footer", ".noprint", "script", "style"], min_chars: 400}
  - site: digiato
    type: news
    count: 8
    discover: {listing: ["https://digiato.com/", "https://digiato.com/tech"], pattern: 'digiato\.com/[a-z0-9-]+/[a-z0-9-]{10,}$', exclude: '/(tag|author|category|topic|page|video|live|product)/'}
    gold: {include: ["main h1", ".articlePost"], exclude: [".postTools", ".postRelated", ".postComments", "script", "style"], min_chars: 400}
  - site: varzesh3
    type: news
    count: 8
    discover: {listing: ["https://www.varzesh3.com/"], pattern: 'varzesh3\.com/news/\d+'}
    gold: {include: ["h1", ".news-body"], exclude: ["script", "style", "[class*=share]"], min_chars: 300}
  - site: asriran
    type: news
    count: 8
    discover: {listing: ["https://www.asriran.com/"], pattern: 'asriran\.com/fa/news/\d+'}
    gold: {include: [".col1-news h1", "h1.title", ".col1-news .subtitle", ".col1-news .body"], exclude: [".adv_news_body", ".top_title_adv", ".errorMDis", "script", "style", ".tags_container"], min_chars: 300}
  # ---------- blog (40) ----------
  - site: nobitex-mag
    type: blog
    count: 10
    discover: {listing: ["https://nobitex.ir/mag/", "https://nobitex.ir/mag/category/education/", "https://nobitex.ir/mag/category/news/"], pattern: 'nobitex\.ir/mag/[a-z0-9]+(-[a-z0-9]+){2,}/$', exclude: '/mag/(category|tag|author|page)/'}
    gold: {include: ["article h1", "article .entry-content"], exclude: [".share-buttons", ".post-extra-info", ".related-posts", ".about-author", "script", "style", ".stream-item"], min_chars: 400}
  - site: virgool
    type: blog
    count: 8
    discover: {listing: ["https://virgool.io/", "https://virgool.io/tags/%D8%AA%DA%A9%D9%86%D9%88%D9%84%D9%88%DA%98%DB%8C"], pattern: 'virgool\.io/@[^/]+/[^/]+-[a-z0-9]{10,}$', exclude: '/@[^/]+/?$'}
    gold: {include: ["h1", ".v-block"], exclude: [".no-print", "script", "style"], min_chars: 400}
  - site: digikala-mag
    type: blog
    count: 8
    discover: {listing: ["https://www.digikala.com/mag/", "https://www.digikala.com/mag/category/technology/"], pattern: 'digikala\.com/mag/[a-z0-9]+(-[a-z0-9]+){2,}/$', exclude: '/mag/(category|tag|author|page)/'}
    gold: {include: ["article .post-module__title", "article .post-module__content"], exclude: [".toc", ".product-cta-wrapper", ".dkmag-related-post", ".dkmag-plp-wrapper", ".post-module__tags", "script", "style"], min_chars: 400}
  - site: hidoctor
    type: blog
    count: 6
    discover: {listing: ["https://www.hidoctor.ir/"], pattern: 'hidoctor\.ir/\d+_', exclude: 'category|tag'}
    gold: {include: ["article.single-post-item .single-post-heading h1", "article.single-post-item .post-content"], exclude: [".post-tags", ".post-share", "script", "style"], min_chars: 400}
  - site: faradars-blog
    type: blog
    count: 4
    discover: {listing: ["https://blog.faradars.org/", "https://blog.faradars.org/category/programming/"], pattern: 'blog\.faradars\.org/[a-z0-9]+(-[a-z0-9]+){1,}/$', exclude: '/(tag|author|category|page|topic)/|terms|app/|careers'}
    gold: {include: ["article h1", "article .the-content"], exclude: [".related-courses", ".post-sharing", ".post-author", ".comments-area", "script", "style", "[class*=print:hidden]"], min_chars: 400}
  - site: ramzarz
    type: blog
    count: 4
    discover: {sitemap: "https://ramzarz.news/sitemap.xml", pattern: 'ramzarz\.news/[a-z0-9-]+/[a-z0-9-]+/$', exclude: '(category|tag|author|exchanges)'}
    gold: {include: ["article h1", "article .entry-content"], exclude: *exclude_common, min_chars: 400}
  # ---------- product (40) ----------
  - site: technolife
    type: product
    count: 12
    discover: {sitemap: "https://www.technolife.com/sitemap.xml", pattern: 'technolife\.com/product-\d+'}
    gold: {include: ["main article"], exclude: ["nav", "button", "script", "style"], min_chars: 150}
  - site: mobit
    type: product
    count: 10
    discover: {listing: ["https://www.mobit.ir/", "https://www.mobit.ir/category/mobile"], pattern: 'mobit\.ir/product/'}
    gold: {include: ["main"], exclude: [".hidden", "nav", "button", "script", "style"], min_chars: 150}
  - site: zoomit-product
    type: product
    count: 8
    discover: {sitemap: "https://www.zoomit.ir/sitemap.xml", pattern: 'zoomit\.ir/product/[a-z0-9-]+/$'}
    gold: {include: ["h1", "main"], exclude: ["nav", "button", "script", "style", "[class*=share]"], min_chars: 150}
  - site: digikala
    type: product
    count: 5
    discover: {sitemap: "https://www.digikala.com/sitemap.xml", pattern: 'digikala\.com/product/dkp-\d+'}
    gold: {include: ["h1", "main"], exclude: ["nav", "button", "script", "style"], min_chars: 150}
  - site: banimode
    type: product
    count: 5
    discover: {listing: ["https://www.banimode.com/"], pattern: 'banimode\.com/product/'}
    gold: {include: ["h1", "main"], exclude: ["nav", "button", "script", "style"], min_chars: 150}
  # ---------- landing / services (30) ----------
  - site: nobitex
    type: landing
    count: 12
    discover: {listing: ["https://nobitex.ir/"], pattern: '^https://nobitex\.ir/[a-z0-9-]+/?$', exclude: '/(mag|login|signup|app|blog|panel)'}
    gold: {include: ["main", ".margin-container"], exclude: ["nav", "header", "footer", "button", "script", "style"], min_chars: 200}
  - site: wallex
    type: landing
    count: 9
    discover: {listing: ["https://wallex.ir/"], pattern: '^https://wallex\.ir/[a-z0-9-]+/?$', exclude: '/(login|signup|blog|app)'}
    gold: {include: ["main article", "main"], exclude: ["nav", "header", "footer", "button", "script", "style"], min_chars: 200}
  - site: bitpin
    type: landing
    count: 9
    discover: {listing: ["https://bitpin.ir/"], pattern: '^https://bitpin\.ir/[a-z0-9-]+/?$', exclude: '/(login|signup|blog|app|academy)'}
    gold: {include: ["main"], exclude: ["nav", "header nav", "button", "script", "style"], min_chars: 200}
  # ---------- forum / Q&A (30) ----------
  - site: ninisite
    type: forum
    count: 14
    discover: {listing: ["https://www.ninisite.com/discussion/", "https://www.ninisite.com/discussion/forum/107/x"], pattern: 'ninisite\.com/discussion/topic/\d+'}
    gold: {include: ["h1", "article.topic-post .postbody"], exclude: [".forum-native-ad", "script", "style", ".signature"], min_chars: 300}
  - site: webhostingtalk
    type: forum
    count: 6
    discover: {listing: ["https://www.webhostingtalk.ir/"], pattern: 'webhostingtalk\.ir/(showthread|threads?)', exclude: 'page'}
    gold: {include: ["h1", ".postbody .content", "[id^=post_message]", ".postcontent", ".message-content", ".bbWrapper"], exclude: [".signature", ".postfoot", "script", "style"], min_chars: 300}
  - site: majidonline
    type: forum
    count: 6
    discover: {listing: ["https://forum.majidonline.com/"], pattern: 'forum\.majidonline\.com/(showthread|threads?)', exclude: 'page'}
    gold: {include: ["h1", ".postbody .content", "[id^=post_message]", ".postcontent", ".message-content", ".bbWrapper"], exclude: [".signature", ".postfoot", "script", "style"], min_chars: 300}
  - site: wordpress-fa
    type: forum
    count: 4
    discover: {listing: ["https://forum.wordpress.org/view/fa/", "https://fa.wordpress.org/support/"], pattern: 'wordpress\.org/support/topic/'}
    gold: {include: ["h1", ".bbp-topic-content", ".bbp-reply-content"], exclude: ["script", "style", ".bbp-reply-header"], min_chars: 200}
