name: release

# انتشار روی PyPI با Trusted Publishing (OIDC): بدون توکن در ریپو.
# یک‌بار در pypi.org → Your projects → Publishing → Add a new pending publisher:
#   owner=miladshooli  repository=filbert  workflow=release.yml  environment=pypi
# بعد هر تگ vX.Y.Z (git push origin vX.Y.Z) خودکار منتشر می‌شود.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra bench --extra export --group dev
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
