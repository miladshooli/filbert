name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra bench --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests bench
      - run: uv run pytest -q
      - name: bench (regression gate on fixtures)
        run: uv run python -m bench.run --dataset fixtures --compare-with trafilatura --check --no-speed-check --no-report
