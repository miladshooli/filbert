[project]
name = "filbert"
version = "0.5.2"
description = "Fast, accurate web main-content + SEO metadata extractor, tuned for Persian/RTL."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Milad Shooli" }]
keywords = ["web-scraping", "content-extraction", "readability", "seo", "persian", "farsi", "rtl", "chunking", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Persian",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx[http2]>=0.27",
  "selectolax>=0.3.21",
  "orjson>=3.10",
  "markdownify>=0.13",
  "typer>=0.12",
  "rich>=13.7",
  "zstandard>=0.22",
  "pyyaml>=6.0",
  "charset-normalizer>=3.3",
  "tldextract>=5.1",
  "jdatetime>=5.0",
]

[project.urls]
Homepage = "https://github.com/miladshooli/filbert"
Repository = "https://github.com/miladshooli/filbert"
Changelog = "https://github.com/miladshooli/filbert/blob/main/CHANGELOG.md"
Issues = "https://github.com/miladshooli/filbert/issues"

[project.optional-dependencies]
render = ["playwright>=1.45"]
ml = ["lightgbm>=4.3", "scikit-learn>=1.5", "joblib>=1.4"]
bench = ["trafilatura>=1.9"]
lang = ["lingua-language-detector>=2.0"]
export = ["openpyxl>=3.1"]
llm = ["anthropic>=1.0"]

[project.scripts]
filbert = "filbert.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "pytest-httpserver>=1.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filbert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:filbert.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["filbert", "bench"]
